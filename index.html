<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; padding: 20px 10px; }
        .container { width: 100%; max-width: 450px; text-align: center; }
        
        /* Header Profile Area */
        .profile-img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; margin-top: 10px; }
        h1 { font-size: 24px; margin: 15px 0 5px; font-weight: 700; }
        .bio { font-size: 14px; color: #aaa; margin-bottom: 20px; }

        /* Social Icons Row */
        .socials { display: flex; justify-content: center; gap: 12px; margin-bottom: 25px; }
        .socials img { width: 40px; height: 40px; border-radius: 50%; transition: transform 0.2s; }
        .socials img:hover { transform: scale(1.05); }

        /* Layout Grid & Cards */
        .links-container { display: flex; flex-direction: column; gap: 15px; }
        .card { display: flex; align-items: flex-end; justify-content: center; width: 100%; text-decoration: none; color: #fff; font-weight: 600; font-size: 16px; border-radius: 24px; background-size: cover; background-position: center; border: 1px solid #222; position: relative; overflow: hidden; padding-bottom: 18px; }
        .card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(transparent 50%, rgba(0,0,0,0.8)); z-index: 1; }
        .card span { z-index: 2; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
        
        /* Specific Card Heights to match 86742.jpg */
        .large { height: 210px; }
        .row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .small { height: 140px; font-size: 13px; padding-bottom: 12px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Profile Info -->
    <img src="images/bg.jpg" class="profile-img" alt="Profile">
    <h1>Your Name Here</h1>
    <p class="bio">Bio description here 🖤</p>

    <!-- Social Icons Link Row -->
    <div class="socials">
        <a href="YOUR_INSTAGRAM_LINK"><img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="IG"></a>
        <a href="YOUR_TELEGRAM_LINK"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="TG"></a>
        <a href="YOUR_TIKTOK_LINK"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046124.png" alt="TT"></a>
    </div>

    <!-- Main Stack Grid -->
    <div class="links-container">
        <!-- Card 1 -->
        <a href="YOUR_LINK" class="card large" style="background-image: url('images/card1.jpg');">
            <span>Exclusive Content 🌶️</span>
        </a>
        
        <!-- Card 2 -->
        <a href="YOUR_LINK" class="card large" style="background-image: url('images/card2.jpg');">
            <span>Message me 🫣</span>
        </a>

        <!-- Bottom 2x2 Grid Section -->
        <div class="row-grid">
            <a href="YOUR_LINK" class="card small" style="background-image: url('images/card3.jpg');">
                <span>My Secret TikTok 🤫</span>
            </a>
            <a href="YOUR_LINK" class="card small" style="background-image: url('images/card4.jpg');">
                <span>My Telegram Group 😈</span>
            </a>
        </div>
    </div>
</div>

</body>
</html>
