<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazel Quinn</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 30px; }
        .container { width: 100%; max-width: 450px; margin: 0 auto; text-align: center; }

        /* Full-width header image section */
        .header-wrapper { width: 100%; position: relative; height: 380px; overflow: hidden; }
        .profile-img { width: 100%; height: 100%; object-fit: cover; }
        .header-fade { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent 60%, #000 100%); }

        /* Content layout shifting down into the fade */
        .content-box { position: relative; margin-top: -60px; padding: 0 15px; z-index: 5; }
        h1 { font-size: 28px; margin-bottom: 15px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .socials { display: flex; justify-content: center; gap: 12px; margin-bottom: 15px; }
        .socials img { width: 40px; height: 40px; border-radius: 50%; transition: transform 0.2s; }
        .socials img:hover { transform: scale(1.05); }
        .bio { font-size: 14px; color: #aaa; margin-bottom: 25px; }

        /* Card styling with white frames */
        .links-container { display: flex; flex-direction: column; gap: 15px; }
        .card { display: flex; align-items: flex-end; justify-content: center; width: 100%; text-decoration: none; color: #fff; border-radius: 24px; overflow: hidden; position: relative; background-size: cover; background-position: center; transition: transform 0.2s; border: 1px solid rgba(255, 255, 255, 0.4); }
        .card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); }
        .card span { z-index: 2; text-shadow: 0 2px 4px rgba(0,0,0,0.6); font-weight: 600; }
        .large { height: 210px; padding-bottom: 20px; }
        .row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .small { height: 140px; font-size: 13px; padding-bottom: 12px; }
    </style>
</head>

                <a href="https://www.tiktok.com/@itshazel_quinn_7_?_r=1&_t=ZS-97P9VRkkJUG"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046124.png" alt="TikTok"></a>
