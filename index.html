<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazel Quinn</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px 0; }
        .container { width: 100%; max-width: 450px; margin: 0 auto; text-align: center; padding: 0 15px; }
        .profile-img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; margin-top: 10px; }
        h1 { font-size: 24px; margin: 15px 0 5px; font-weight: 700; }
        .bio { font-size: 14px; color: #aaa; margin-bottom: 20px; }
        .socials { display: flex; justify-content: center; gap: 12px; margin-bottom: 25px; }
        .socials img { width: 40px; height: 40px; border-radius: 50%; transition: transform 0.2s; }
        .socials img:hover { transform: scale(1.05); }
        .links-container { display: flex; flex-direction: column; gap: 15px; }
        .card { display: flex; align-items: flex-end; justify-content: center; width: 100%; text-decoration: none; color: #fff; border-radius: 16px; overflow: hidden; position: relative; background-size: cover; background-position: center; transition: transform 0.2s; }
        .card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); }
        .card span { z-index: 2; text-shadow: 0 2px 4px rgba(0,0,0,0.6); font-weight: 600; }
        .large { height: 210px; padding-bottom: 20px; }
        .row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .small { height: 140px; font-size: 13px; padding-bottom: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <img src="bg.jpg" class="profile-img" alt="Profile">
        <h1>Hazel Quinn</h1>
        <p class="bio">Your new Favorite Girl💜</p>

        <div class="socials">
            <a href="https://t.me/yourhazelquinn00"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="TG"></a>
            <a href="https://www.tiktok.com/@itshazel_quinn_7_?_r=1&_t=ZS-9BzSVV7CJJj"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046124.png" alt="TikTok"></a>
        </div>

        <div class="links-container">
            <a href="https://t.me/yourhazelquinn00" class="card large" style="background-image: url('card2.jpg');">
                <span>Message me 👶</span>
            </a>

            <div class="row-grid">
                <a href="https://www.instagram.com/itshazel_quinn_?igsh=M2MxeTQ1cm8pNWhs=" class="card small" style="background-image: url('insta.jpg');">
                    <span>Instagram 📸</span>
                </a>
                <a href="https://www.tiktok.com/@itshazel_quinn_7_?_r=1&_t=ZS-9BzSVV7CJJj" class="card small" style="background-image: url('card3.jpg');">
                    <span>My Secret TikTok 🤫</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
